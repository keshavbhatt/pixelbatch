name: pixelbatch
base: core24
version: '2.1.0'
summary: Batch Image Optimization Tool
description: |
  PixelBatch is a powerful batch image optimization application that helps you
  reduce file sizes while maintaining quality. Perfect for web developers,
  photographers, and content creators.

  Features:
  - Multi-format support: JPEG, PNG, GIF, and SVG optimization
  - Professional optimizers: jpegoptim, pngquant, gifsicle, and SVGO
  - Batch processing: Optimize hundreds of images at once
  - Concurrent processing: Multi-threaded optimization for speed
  - Real-time statistics: See file size reduction as you work
  - Format-specific settings: Fine-tune optimization for each image type
  - Dark and Light themes with Qt Creator-inspired color schemes
  - Professional UI with comprehensive preferences

  Supported optimizers:
  - jpegoptim: JPEG lossless and lossy compression
  - pngquant: PNG lossy compression with excellent quality
  - gifsicle: GIF optimization and animation processing
  - SVGO: SVG optimization and cleanup

license: GPL-3.0-or-later
website: https://ktechpit.com/USS/public
source-code: https://github.com/keshavbhatt/pixelbatch
issues: https://github.com/keshavbhatt/pixelbatch/issues
contact: https://github.com/keshavbhatt/pixelbatch/issues

grade: stable
confinement: strict
icon: snap/gui/icon.svg
compression: lzo

platforms:
  amd64:
  arm64:

apps:
  pixelbatch:
    command: usr/bin/pixelbatch
    extensions: [kde-neon-6]
    desktop: usr/share/applications/com.ktechpit.pixelbatch.desktop
    environment:
      # Extend PATH so the app finds the bundled optimizer tools
      PATH: $SNAP/usr/bin:$SNAP/usr/local/bin:$PATH
    plugs:
      - gsettings
      - home
      - network
      - opengl
      - removable-media
      - unity7
      - wayland
      - x11

parts:
  application:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
    stage-packages:
      # Image optimizer tools
      - jpegoptim
      - pngquant
      - gifsicle
      # Libraries specifically needed by optimizer tools
      - libjpeg-turbo8
      - libpng16-16
      - libgif7
    override-build: |
      craftctl default
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/com.ktechpit.pixelbatch.svg|' ${CRAFT_PART_INSTALL}/usr/share/applications/com.ktechpit.pixelbatch.desktop

  svgo:
    plugin: npm
    source: .
    npm-include-node: true
    npm-node-version: "18.19.0"
    build-environment:
      # The kde-neon-6 extension points PATH at the Qt SDK snap, whose
      # bundled node/npm hijack the npm plugin and abort (SDK libnode
      # can't find its externalized builtins). Put the plugin's own
      # downloaded node (extracted into the part install dir) first again.
      - PATH: "${CRAFT_PART_INSTALL}/bin:${PATH}"
    override-prime: |
      craftctl default

      # Create symlink to svgo executable in usr/bin
      mkdir -p ${CRAFT_PRIME}/usr/bin

      # Find svgo and create symlink (it's installed as a dependency)
      if [ -f ${CRAFT_PRIME}/lib/node_modules/pixelbatch-svgo/node_modules/svgo/bin/svgo ]; then
          ln -sf ../../lib/node_modules/pixelbatch-svgo/node_modules/svgo/bin/svgo ${CRAFT_PRIME}/usr/bin/svgo
          chmod +x ${CRAFT_PRIME}/lib/node_modules/pixelbatch-svgo/node_modules/svgo/bin/svgo
      elif [ -f ${CRAFT_PRIME}/lib/node_modules/svgo/bin/svgo ]; then
          ln -sf ../../lib/node_modules/svgo/bin/svgo ${CRAFT_PRIME}/usr/bin/svgo
          chmod +x ${CRAFT_PRIME}/lib/node_modules/svgo/bin/svgo
      elif [ -f ${CRAFT_PRIME}/bin/svgo ]; then
          ln -sf ../bin/svgo ${CRAFT_PRIME}/usr/bin/svgo
          chmod +x ${CRAFT_PRIME}/bin/svgo
      fi
